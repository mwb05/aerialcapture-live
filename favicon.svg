<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Aerial Capture Photography — quadcopter drone mark -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0B0D0C"/>
  <g stroke="#81C1E8" stroke-width="3.5" stroke-linecap="round" fill="none">
    <!-- arms -->
    <path d="M25 25 L16 16 M39 25 L48 16 M25 39 L16 48 M39 39 L48 48"/>
    <!-- rotors -->
    <circle cx="14" cy="14" r="6"/>
    <circle cx="50" cy="14" r="6"/>
    <circle cx="14" cy="50" r="6"/>
    <circle cx="50" cy="50" r="6"/>
  </g>
  <!-- body with camera lens -->
  <rect x="24" y="24" width="16" height="16" rx="5" fill="#81C1E8"/>
  <circle cx="32" cy="32" r="4" fill="#0B0D0C"/>
  <circle cx="32" cy="32" r="1.6" fill="#81C1E8"/>
</svg>
